[package]
name = "eosed-rs"
version = "0.1.0"
edition = "2021"
license = "GPL-2.0-or-later"
description = "Rust port of eosed: terminal tool for the E-mu EOS sampler family over MIDI SysEx"

[dependencies]
toml = { version = "0.8", features = ["preserve_order"] }
thiserror = "1"
dirs = "5"
encoding_rs = "0.8"
midir = "0.11.1"
serde_json = "1.0.154"
ratatui = "0.30.2"
crossterm = "0.29.0"

[lib]
name = "eosed"
path = "src/lib.rs"
