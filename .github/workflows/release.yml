name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  build:
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            arch: x86_64-linux
          - os: macos-latest
            arch: aarch64-macos
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - if: matrix.os == 'ubuntu-latest'
        run: sudo apt-get update && sudo apt-get install -y libasound2-dev
      - uses: dtolnay/rust-toolchain@stable
      - run: cargo build --release
      - run: |
          mkdir -p dist
          tar -czf dist/eosed-rs-${{ matrix.arch }}.tar.gz \
            -C target/release \
            eosed_cli eosed_tui load_bank preset_snapshot carrier_check lcd_read fulltest
      - uses: actions/upload-artifact@v4
        with:
          name: eosed-rs-${{ matrix.arch }}.tar.gz
          path: dist/*.tar.gz

  release:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
      - uses: softprops/action-gh-release@v2
        with:
          files: artifacts/**/*.tar.gz
          body: "Binaries: eosed_cli, eosed_tui, load_bank, preset_snapshot, carrier_check, lcd_read. Per-platform tar.gz below (x86_64 Linux, aarch64 macOS). Write operations are off by default; see SECURITY.md."
